[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planet-hunters-ml"
version = "1.0.0"
description = "Autonomous Time-Series Photometry Classification for Exoplanet Discovery (Hack4Hack 2026 Round 1)"
readme = "README.md"
authors = [
    { name = "Planet Hunters ML Team" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "astronomy",
    "exoplanet-discovery",
    "lightcurves",
    "machine-learning",
    "time-series-classification",
    "lightgbm",
    "scikit-learn",
    "photometry"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "xgboost>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyarrow>=14.0.0",
    "tabulate>=0.9.0",
    "joblib>=1.3.0",
    "tqdm>=4.66.0",
    "astropy>=6.0.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
